<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>2画面動画プレイヤー</title>
  <style>
    body { text-align: center; font-family: sans-serif; }
    video { width: 45%; margin: 1%; }
  </style>
</head>
<body>
  <h1>2画面で同じ動画を再生</h1>
  <video id="left" controls>
    <source src="your-video.mp4" type="video/mp4">
    対応していないブラウザです。
  </video>
  <video id="right" controls>
    <source src="your-video.mp4" type="video/mp4">
    対応していないブラウザです。
  </video>

  <script>
    // 同時再生機能
    const v1 = document.getElementById('left');
    const v2 = document.getElementById('right');

    v1.onplay = () => v2.play();
    v1.onpause = () => v2.pause();
    v1.onseeking = () => { v2.currentTime = v1.currentTime; };
    v1.ontimeupdate = () => {
      if (Math.abs(v1.currentTime - v2.currentTime) > 0.3) {
        v2.currentTime = v1.currentTime;
      }
    };
  </script>
</body>
</html>
