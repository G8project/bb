<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>2画面動画プレイヤー</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    .video-container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    video {
      width: 48%;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    label {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>2つの動画を横に並べて再生</h1>

  <div>
    <label>ローカル動画（左）:</label><br>
    <input type="file" id="videoFile1" accept="video/*"><br><br>

    <label>動画URL（右）:</label><br>
    <input type="text" id="videoUrl2" placeholder="https://example.com/video.mp4" size="50"><br><br>

    <button onclick="loadVideos()">読み込む</button>
  </div>

  <div class="video-container">
    <video id="video1" controls></video>
    <video id="video2" controls></video>
  </div>

  <script>
    function loadVideos() {
      const fileInput = document.getElementById('videoFile1');
      const urlInput = document.getElementById('videoUrl2');
      const video1 = document.getElementById('video1');
      const video2 = document.getElementById('video2');

      // ローカルファイルを表示
      if (fileInput.files.length > 0) {
        const fileURL = URL.createObjectURL(fileInput.files[0]);
        video1.src = fileURL;
      } else {
        video1.src = "";
      }

      // URLから読み込み（CORS対応必須）
      const url = urlInput.value.trim();
      if (url) {
        video2.src = url;
      } else {
        video2.src = "";
      }
    }
  </script>
</body>
</html>
